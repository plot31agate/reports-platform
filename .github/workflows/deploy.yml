name: Deploy to VPS

on:
  push:
    branches: [main]
    # Finance HQ has its own build+deploy (deploy-finance.yml) into the
    # subdomain's /finance folder; a finance-only push must not redeploy/restart
    # the reporting service. Agency HQ, by contrast, is SERVED BY this app (a
    # /agency route + live snapshot from reporting.db), so agency changes DO
    # belong to this deploy — its built dist is uploaded alongside the app.
    paths-ignore:
      - 'finance/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Agency HQ is a Vite app served by the reporting app at /agency, so it
      # must be BUILT before upload. Only agency/dist ships (see excludes).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agency/package-lock.json

      - name: Build Agency HQ
        working-directory: agency
        run: |
          npm ci
          npm run build

      - name: Upload changed files over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ./
          log-level: minimal
          security: loose
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/venv/**
            **/__pycache__/**
            **/*.pyc
            .env
            reporting.db
            *.db
            *.sqlite
            data/**
            reports_out/**
            sample_data/**
            # Finance HQ has its own build+deploy (deploy-finance.yml) into the
            # subdomain's /finance folder — keep its source out of the Python app dir.
            finance/**
            # Agency HQ: ship ONLY the built dist (served at /agency). Its source,
            # deps and dev files stay out of the Python app dir.
            agency/node_modules/**
            agency/src/**
            agency/public/**
            agency/index.html
            agency/package.json
            agency/package-lock.json
            agency/tsconfig.json
            agency/vite.config.ts
            agency/vite-env.d.ts
            agency/.gitignore

      - name: Restart service via webhook
        run: |
          curl -sf -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}" \
            "https://digital-footprints.co.uk/deploy-restart.php" \
            || (echo "Restart webhook failed" && exit 1)
